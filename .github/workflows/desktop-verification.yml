name: Native desktop verification

on:
  pull_request:
    paths:
      - '.github/workflows/desktop-verification.yml'
      - 'Cargo.*'
      - 'crates/**'
      - 'desktop/**'
      - 'plugins/**'
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to verify
        type: choice
        options:
          - all
          - windows
          - macos
          - linux
        default: all

permissions:
  contents: read

concurrency:
  group: native-desktop-${{ github.event.pull_request.number || github.ref }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: true

jobs:
  windows:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'windows' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Test capture core
        run: cargo +1.99.1 test --workspace --locked
      - name: Test shared interface
        run: cargo +1.99.1 test --locked --manifest-path crates/backtracking-ui/Cargo.toml
      - name: Test native desktop
        run: cargo +1.99.1 test --locked --manifest-path desktop/windows/Cargo.toml
      - name: Test native plug-in
        run: cargo +1.99.1 test --locked --manifest-path plugins/backtracking-plugin/Cargo.toml
      - name: Build Windows releases
        run: |
          if ($env:GITHUB_REPOSITORY -eq 'kekekewww/Backtracking') {
            $env:BACKTRACKING_UPDATE_PUBLIC_KEY = (Get-Content -Raw desktop/update-public-key.hex).Trim()
          }
          cargo +1.99.1 build --locked --release --manifest-path desktop/windows/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:BACKTRACKING_UPDATE_PUBLIC_KEY) {
            $exe = Join-Path $PWD 'desktop/windows/target/release/Backtracking.exe'
            $binaryHex = [Convert]::ToHexString([IO.File]::ReadAllBytes($exe))
            $key = $env:BACKTRACKING_UPDATE_PUBLIC_KEY
            $keyTextHex = [Convert]::ToHexString([Text.Encoding]::ASCII.GetBytes($key))
            if (!$binaryHex.Contains($key.ToUpperInvariant()) -and !$binaryHex.Contains($keyTextHex)) {
              throw 'Backtracking.exe does not contain the configured update public key.'
            }
          }
          cargo +1.99.1 build --locked --release --manifest-path plugins/backtracking-plugin/Cargo.toml

  macos:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'macos' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Build and verify macOS app
        run: |
          if [[ "$GITHUB_REPOSITORY" == "kekekewww/Backtracking" ]]; then
            read -r BACKTRACKING_UPDATE_PUBLIC_KEY < desktop/update-public-key.hex
            export BACKTRACKING_UPDATE_PUBLIC_KEY
          fi
          RUSTUP_TOOLCHAIN=1.99.1 bash desktop/macos/build.sh
          if [[ -n "${BACKTRACKING_UPDATE_PUBLIC_KEY:-}" ]]; then
            embedded_key=$(/usr/libexec/PlistBuddy -c 'Print :BacktrackingUpdatePublicKey' target/bundled/Backtracking.app/Contents/Info.plist)
            test "$embedded_key" = "$BACKTRACKING_UPDATE_PUBLIC_KEY"
          fi
          codesign --verify --strict --deep target/bundled/Backtracking.app
      - name: Test signed update and rollback on macOS
        if: ${{ !cancelled() }}
        run: |
          xcrun swiftc -swift-version 5 -parse-as-library -D BACKTRACKING_UPDATER_TESTS \
            desktop/macos/StartupUpdater.swift desktop/macos/tests/StartupUpdaterTests.swift \
            -framework AppKit -o "$RUNNER_TEMP/backtracking-updater-tests"
          "$RUNNER_TEMP/backtracking-updater-tests"
      - name: Verify Swift capture routes and paired WAV export
        if: ${{ !cancelled() }}
        run: RUSTUP_TOOLCHAIN=1.99.1 bash desktop/macos/verify-capture.sh
      - name: Test capture core and plug-in
        if: ${{ !cancelled() }}
        run: |
          cargo +1.99.1 test --workspace --locked
          cargo +1.99.1 test --locked --manifest-path plugins/backtracking-plugin/Cargo.toml

  linux:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'linux' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Install Linux shortcut build dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libglib2.0-dev xvfb xdotool
      - name: Test Linux shortcut helper
        run: cargo +1.99.1 test --locked --manifest-path desktop/linux/Cargo.toml
      - name: Verify independent plug-in Sender connections
        run: cargo +1.99.1 test --locked --workspace same_named_senders_fan_out_and_snapshot_targets_are_independent -- --ignored
      - name: Verify X11 shortcut activation and duplicate registration
        run: |
          cargo +1.99.1 build --locked --manifest-path desktop/linux/Cargo.toml
          env -u WAYLAND_DISPLAY XDG_SESSION_TYPE=x11 xvfb-run -a bash -euo pipefail <<'SCRIPT'
          shortcut=desktop/linux/target/debug/backtracking-shortcut
          "$shortcut" >shortcut.log 2>&1 &
          helper_pid=$!
          cleanup() {
            result=$?
            trap - EXIT
            kill "$helper_pid" 2>/dev/null || true
            wait "$helper_pid" 2>/dev/null || true
            if (( result != 0 )); then
              for log in shortcut.log duplicate.log; do
                if [[ -f "$log" ]]; then
                  printf '%s\n' "X11 diagnostic: $log"
                  cat "$log"
                fi
              done
              if command -v xmodmap >/dev/null 2>&1; then
                printf '%s\n' 'X11 diagnostic: modifier map'
                xmodmap -pm || true
                printf '%s\n' 'X11 diagnostic: relevant key symbols'
                xmodmap -pke | awk '/grave|asciitilde|Super_L|Super_R/' || true
              fi
              if command -v xkbcomp >/dev/null 2>&1; then
                printf '%s\n' 'X11 diagnostic: physical key names and Super symbols'
                xkbcomp -w 0 -xkb "$DISPLAY" - |
                  awk '/xkb_keycodes|minimum|maximum|<TLDE>|<LWIN>|<RWIN>|modifier_map|Super_L|Super_R/' || true
              fi
            fi
            exit "$result"
          }
          trap cleanup EXIT
          for attempt in {1..25}; do
            if grep -q 'listening for Super+grave' shortcut.log; then break; fi
            sleep 0.1
          done
          grep 'listening for Super+grave' shortcut.log
          if "$shortcut" >duplicate.log 2>&1; then exit 1; fi
          grep 'already registered' duplicate.log
          xdotool keydown Super_L keydown grave
          sleep 1.2
          xdotool keyup grave keyup Super_L
          sleep 0.2
          test "$(grep -c 'no running Backtracking plug-in instance' shortcut.log)" -eq 1
          SCRIPT
