[package]
name = "backtracking-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
publish = false

[dependencies]
backtracking-core = { path = "../backtracking-core" }
egui = { version = "0.37", default-features = false }

[dev-dependencies]
# Headless frames lay out text, which needs a font.
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }

# Standalone package: keeps cargo from walking up into an enclosing workspace
# (for example when this checkout is nested inside another one), and keeps egui
# out of the root workspace's lock file.
[workspace]
