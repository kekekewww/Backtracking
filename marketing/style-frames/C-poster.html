<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Backtracking — C poster</title>
<link rel="stylesheet" href="shared/bt-panel.css">
<link rel="stylesheet" href="C.css">
<style>
  body { width: 1080px; height: 1350px; }
  .frame { width: 1080px; height: 1350px; }
  .lockup { left: 64px; top: 58px; }
  .lockup .wm { font-size: 30px; }
  .tag { right: 64px; top: 78px; font-size: 13px; }
  .bgwave { left: -20px; top: 760px; }
  .mega { left: 56px; top: 146px; font-size: 300px; }
  .sub { left: 64px; top: 668px; width: 760px; font-size: 25px; }
  .scale { left: 64px; top: 790px; width: 952px; font-size: 17px; }
  .panel { left: 64px; top: 862px; }
  .panel .btp { zoom: 1.66; }
  .streaks { left: 0; top: 0; }
  .slab { left: 480px; top: 1112px; }
  .cursor { left: 466px; top: 1098px; }
  .rule { left: 64px; width: 952px; top: 1246px; }
  .editions { left: 64px; top: 1270px; font-size: 16px; }
  .license { right: 64px; top: 1270px; font-size: 16px; color: var(--c-paper-2); }
</style>
</head>
<body>
<div class="frame">
  <div class="bgwave" data-wave='{"width":1120,"height":520,"seed":23,"style":"mixed","step":3}'></div>

  <div class="lockup">
    <img src="../../assets/backtracking-icon.svg" width="60" height="60" alt="">
    <span class="wm">Backtracking</span>
  </div>
  <div class="tag wide">Retrospective audio sampler</div>

  <h1 class="mega">Take it<br><span class="m">back.</span></h1>

  <p class="sub">Select what you just heard and drag it out as a WAV. Backtracking keeps up to <b>10&nbsp;minutes</b> of audio in memory.</p>

  <div class="scale wide"><span>10 s</span><span>20 s</span><span>30 s</span><span>60 s</span><span>3 min</span><span>5 min</span><span class="on">10 min</span></div>

  <div class="panel"><div class="btp c" data-btp='{"width":556,"waveHeight":70,"seed":19,"style":"mixed","selection":[0.3,0.56],"duration":"7.40 s","tooltip":{"text":"Drag and Drop","at":0.43,"y":54},"meter":"&minus;14.1","meterUnit":"LUFS"}'></div></div>

  <svg class="streaks" width="1080" height="1350" viewBox="0 0 1080 1350">
    <line x1="160" y1="1128" x2="440" y2="1128" stroke-width="4"/>
    <line x1="250" y1="1150" x2="440" y2="1150" stroke-width="4" opacity=".7"/>
    <line x1="330" y1="1172" x2="440" y2="1172" stroke-width="4" opacity=".45"/>
  </svg>

  <div class="slab">
    <div class="ic">WAV</div>
    <div><div class="n">Backtracking-1794…-13.wav</div><div class="m">7.40 s · 48 kHz · 32-bit float</div></div>
  </div>
  <svg class="cursor" width="28" height="40" viewBox="0 0 14 20"><path d="M1 1v15.5l3.8-3.6 2.6 6 2.4-1-2.5-5.9h5.3Z" fill="#fff" stroke="#070c3d" stroke-width="1.1" stroke-linejoin="round"/></svg>

  <div class="rule"></div>
  <div class="editions wide"><span>Windows</span><span>macOS</span><span>VST3</span><span>CLAP</span></div>
  <div class="license wide">Open source</div>
</div>
<script src="shared/bt-panel.js"></script>
</body>
</html>
