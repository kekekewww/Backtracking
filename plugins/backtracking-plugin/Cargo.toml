[package]
name = "backtracking-plugin"
version = "0.1.5"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["editor"]
editor = [
    "nice-plug/editor",
    "dep:nice-plug-egui",
    "dep:egui",
    "dep:png",
    "dep:rfd",
    "dep:open",
    "dep:dunce",
    "dep:objc2",
    "dep:objc2-app-kit",
    "dep:objc2-foundation",
    "dep:raw-window-handle",
    "dep:windows",
    "dep:windows-core",
]

[dependencies]
backtracking-core = { path = "../../crates/backtracking-core" }
nice-plug = "=0.4.2"
nice-plug-egui = { version = "=0.6.0", optional = true }
egui = { version = "0.37", features = ["default_fonts"], optional = true }
png = { version = "0.18", optional = true }
rfd = { version = "0.17", optional = true }
open = { version = "5.4.5", optional = true, features = ["shellexecute-on-windows"] }

[target.'cfg(target_os = "windows")'.dependencies]
dunce = { version = "1.0", optional = true }
windows-core = { version = "0.62", optional = true }
windows = { version = "0.62", optional = true, features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
raw-window-handle = { version = "0.6", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", default-features = false, optional = true, features = [
    "std",
    "NSDragging",
    "NSDraggingItem",
    "NSDraggingSession",
    "NSEvent",
    "NSGraphicsContext",
    "NSImage",
    "NSPasteboard",
    "NSResponder",
    "NSView",
    "NSWindow",
] }
objc2-foundation = { version = "0.3", default-features = false, optional = true, features = [
    "std",
    "NSArray",
    "NSData",
    "NSGeometry",
    "NSObject",
    "NSString",
    "NSURL",
] }
